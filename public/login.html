<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WhatsApp Bot Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f5f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-header img {
      width: 80px;
      margin-bottom: 15px;
    }
    .login-header h2 {
      color: #128C7E;
      font-weight: 600;
    }
    .form-control:focus {
      border-color: #128C7E;
      box-shadow: 0 0 0 0.25rem rgba(18, 140, 126, 0.25);
    }
    .btn-primary {
      background-color: #128C7E;
      border-color: #128C7E;
    }
    .btn-primary:hover, .btn-primary:focus {
      background-color: #0C6B61;
      border-color: #0C6B61;
    }
    .alert {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-container">
      <div class="login-header">
        <img src="https://cdn-icons-png.flaticon.com/512/124/124034.png" alt="WhatsApp Logo">
        <h2>WhatsApp Bot</h2>
        <p class="text-muted">Login ke Dashboard Admin</p>
      </div>
      
      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>
      
      <div class="alert alert-danger" id="errorAlert" role="alert">
        Username atau password salah!
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');
      
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Simpan token ke localStorage
          localStorage.setItem('token', data.token);
          // Redirect ke dashboard
          window.location.href = '/dashboard.html';
        } else {
          errorAlert.style.display = 'block';
          setTimeout(() => {
            errorAlert.style.display = 'none';
          }, 3000);
        }
      } catch (error) {
        console.error('Login error:', error);
        errorAlert.textContent = 'Terjadi kesalahan server. Silakan coba lagi.';
        errorAlert.style.display = 'block';
        setTimeout(() => {
          errorAlert.style.display = 'none';
        }, 3000);
      }
    });
    
    // Cek jika sudah login
    window.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = '/dashboard.html';
      }
    });
  </script>
</body>
</html>
